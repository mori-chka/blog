<h2>◇長尾龍一『法哲学入門』（講談社学術文庫）</h2>

<p>
  法解釈学<br>
  実定法の意味をその適用に適うように論理的、体系的に解き明かす学問。解釈法学。（コトバンクより）
</p>

<p>
  実定法<br>
  人為により成立された法または特定の社会内で習慣的に行われている法のこと。（行書塾サイトより）<br>
  ⇔自然法
</p>

<p>
  自然法<br>
  自然や人間を支配する普遍的な規範。これを人間の作る法律より上にあるものと理解する古代ギリシア（特にストア派）以降の思想を自然法思想と呼ぶ。（第一学習社用語解説より）<br>
  ◇私は法律に優劣はつけるべきでないと考える。
</p>

<p>
  碧海純一<br>
  東大卒の法哲学者。著作に『法哲学概論』など。2013年没。
</p>
